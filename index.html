<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff7ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Michelle Arcade">
<title>Michelle Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app"><main class="shell">
<section id="home" class="screen home active">
  <div class="eyebrow">TNT × MICHELLE</div>
  <h1>Michelle<br>Arcade</h1>
  <p class="sub">เกมสั้น ๆ เล่นด้วยนิ้วเดียวบน iPhone — ตบบอลให้ทัน แล้วกะจังหวะโดดขึ้นโต๊ะหลบมือ</p>
  <div class="hero">
    <svg class="cat-svg" viewBox="0 0 280 260" aria-label="Michelle the tabby cat">
      <ellipse cx="140" cy="238" rx="80" ry="12" fill="#6b431f" opacity=".13"/>
      <path d="M82 151c0-53 28-86 60-86s60 33 60 86v47c0 31-22 45-60 45s-60-14-60-45z" fill="#aa7443" stroke="#5b3b25" stroke-width="3"/>
      <path d="M96 173c15 21 24 31 46 31 23 0 34-12 48-33v46c-13 18-29 26-48 26-21 0-37-7-48-25z" fill="#fff8ee"/>
      <path d="M92 61L67 20l46 26M190 61l25-41-46 26" fill="#a56f41" stroke="#5b3b25" stroke-width="4" stroke-linejoin="round"/>
      <path d="M83 46L73 29l26 15M201 46l10-17-26 15" fill="#efb9ad"/>
      <ellipse cx="142" cy="93" rx="65" ry="58" fill="#b67b45" stroke="#5b3b25" stroke-width="3"/>
      <path d="M142 42l-11 25m11-25 11 25M108 50l13 24M176 50l-13 24" stroke="#5d3d27" stroke-width="5" stroke-linecap="round"/>
      <path d="M88 88l26 7M85 104l30 0M196 88l-26 7M199 104l-30 0" stroke="#5d3d27" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="115" cy="91" rx="13" ry="17" fill="#c7d76b" stroke="#4b3825" stroke-width="3"/><ellipse cx="169" cy="91" rx="13" ry="17" fill="#c7d76b" stroke="#4b3825" stroke-width="3"/>
      <ellipse cx="116" cy="92" rx="5" ry="11" fill="#162218"/><ellipse cx="168" cy="92" rx="5" ry="11" fill="#162218"/><circle cx="111" cy="86" r="3" fill="#fff"/><circle cx="163" cy="86" r="3" fill="#fff"/>
      <path d="M120 116c7-7 37-7 44 0v16c-5 12-15 18-22 18s-17-6-22-18z" fill="#fff8ee"/>
      <path d="M134 116q8-8 16 0-8 9-16 0" fill="#f3a4a8" stroke="#7a4b45" stroke-width="2"/>
      <path d="M142 124v8m0 0c-7 5-12 4-17 1m17-1c7 5 12 4 17 1" stroke="#6a4636" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M87 176l-19 28c-7 11 2 24 15 20l24-8M197 176l18 28c7 11-2 24-15 20l-23-8" fill="#fff8ee" stroke="#5b3b25" stroke-width="3"/>
      <path d="M94 149l24 10M190 149l-24 10M92 164l24 9M192 164l-24 9" stroke="#5d3d27" stroke-width="5" stroke-linecap="round"/>
      <path d="M201 196c39 2 50 19 34 36-12 12-38 9-51 4" fill="none" stroke="#7a4e2c" stroke-width="17" stroke-linecap="round"/>
      <path d="M221 204l15 8m-28 8 18 9" stroke="#3f2a1d" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="modes">
    <button class="mode" data-game="ball"><div class="icon">🔵</div><div><strong>Blue Ball Bash</strong><small>แตะหน้าจอให้มิเชลตบลูกบอลสีฟ้า อย่าให้ตกพื้นครบ 3 ครั้ง</small></div><div class="chev">›</div></button>
    <button class="mode" data-game="jump"><div class="icon">💻</div><div><strong>Notebook Ninja</strong><small>แตะเพื่อโดดขึ้นโต๊ะที่มี notebook และหลบมือที่จะตี</small></div><div class="chev">›</div></button>
  </div>
</section>
<section id="ball" class="screen game">
  <canvas id="ballCanvas"></canvas>
  <div class="hud"><button class="back" aria-label="Back">‹</button><div class="score"><b id="ballScore">0</b><span>SCORE</span></div><div class="lives" id="ballLives">♥♥♥</div></div>
  <div class="hint">แตะตอนบอลเข้าใกล้มิเชล</div><div id="ballToast" class="toast">HIT!</div>
  <div id="ballOver" class="overlay"><div class="panel"><h2>Game Over</h2><p id="ballSummary"></p><button id="ballRetry" class="primary">เล่นอีกครั้ง</button><button class="secondary back">กลับหน้าแรก</button></div></div>
</section>
<section id="jump" class="screen game">
  <canvas id="jumpCanvas"></canvas>
  <div class="hud"><button class="back" aria-label="Back">‹</button><div class="score"><b id="jumpScore">0</b><span>SAFE JUMPS</span></div><div class="lives" id="jumpLives">♥♥♥</div></div>
  <div id="roundLabel" class="round">ROUND 1</div><div class="hint">เห็น ⚠️ แล้วกะจังหวะโดด</div><div id="jumpToast" class="toast">SAFE!</div>
  <div id="jumpOver" class="overlay"><div class="panel"><h2>โดนจับได้!</h2><p id="jumpSummary"></p><button id="jumpRetry" class="primary">ลองใหม่</button><button class="secondary back">กลับหน้าแรก</button></div></div>
</section>
</main></div>
<script src="game.js"></script>
</body></html>
